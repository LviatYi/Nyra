[package]
name = "nyra"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["ui", "system_font_discovery"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9.8"

# Perception processes a full 4K RGBA frame in these dependencies. Keeping the
# application debuggable while optimizing only capture and PNG compression
# avoids multi-second record latency in the dev profile.
[profile.dev.package.xcap]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

# arrayref 0.3.10 currently points at a nonexistent proc-macro1 crate.
# Pin the upstream 0.3.9 source until the registry release is corrected.
[patch.crates-io]
arrayref = { git = "https://github.com/droundy/arrayref", rev = "f8d0299d863922db6c409d08098941e833b70d69" }
